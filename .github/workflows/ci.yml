name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck (shared, api, app)
        run: npm run typecheck
      - name: Tests (money engine, API integration)
        run: npm test -w api
      - name: Lint (new web app)
        run: npm run lint -w web
      - name: Build new web app as static files
        run: npm run build -w web
      - name: Lint (old web app)
        # The old app has ~100 lint errors and is replaced by web/ in v2.
        # Reported but not blocking; this step goes away with the old app.
        continue-on-error: true
        run: npm run lint -w app
