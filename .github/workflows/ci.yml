name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck (shared, client, api, web, mobile)
        run: npm run typecheck
      - name: Tests (money engine, API integration on in-memory Postgres)
        run: npm test -w api
      - name: Lint (web)
        run: npm run lint -w web
      - name: Build web as static files
        run: npm run build -w web

  e2e:
    name: Browser tests (flow, offline, accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A real Postgres, so the production database path (driver, migrations, SQL) is exercised.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settlemint
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build API the way Render does
        run: npm run build -w api
      - name: Start API on Postgres
        working-directory: api
        env:
          V1_DATABASE_URL: postgres://postgres:postgres@localhost:5432/settlemint
          PORT: "8001"
          WEB_ORIGINS: http://localhost:4555
          # Sample receipt instead of the AI, so the scanning flow is testable without a key.
          FAKE_RECEIPT_READER: "1"
          # The suites sign up many accounts back to back from one address.
          AUTH_RATE_LIMIT: "off"
          EMAIL_VERIFICATION: "off"
        run: |
          # Throwaway notification keys for this run only.
          eval "$(node -e "const k=require('web-push').generateVAPIDKeys();console.log('export VAPID_PUBLIC_KEY='+k.publicKey+' VAPID_PRIVATE_KEY='+k.privateKey)")"
          nohup npm run start:v1 > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8001/health && exit 0; sleep 1; done
          cat ../api.log; exit 1
      - name: Build web against it
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
        run: npm run build -w web
      - name: Main flow
        working-directory: web
        run: node e2e/flow.mjs out ../e2e-shots phone dark
      - name: Offline sync
        working-directory: web
        run: node e2e/offline.mjs out ../e2e-shots/offline
      - name: Live updates (two browsers)
        working-directory: web
        run: node e2e/live.mjs out
      - name: Notifications (subscribe, worker, real delivery)
        working-directory: web
        run: node e2e/push.mjs out
      - name: Languages (Arabic right-to-left, switching, Hindi)
        working-directory: web
        run: node e2e/i18n.mjs out ../e2e-shots/i18n
      - name: Saved QR codes and reminders (the redrawn code must scan back)
        working-directory: web
        run: node e2e/payqr.mjs out http://localhost:8001 "" ../e2e-shots
      - name: Accessibility (axe, WCAG 2.2 AA)
        working-directory: web
        run: node e2e/a11y.mjs out
      - name: "Phone app (web build of the same screens: sign-in to settle-up, Arabic)"
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8001
        run: npx expo export --platform web --output-dir ../mobile-web && node e2e/smoke.mjs ../mobile-web
      - name: API log
        if: failure()
        run: cat api.log
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots
          if-no-files-found: ignore

  deploy-api:
    name: Deploy API to Render
    needs: [check, e2e]
    # Only after every check passes, and only for the branch Render builds from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Render to deploy
        env:
          # A repository secret holding the service's private deploy-hook URL.
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set; skipping the deploy."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Deploy requested."
