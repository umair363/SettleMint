# Optional: a local Postgres, for running the API the way production does
# (set V1_DATABASE_URL=postgres://postgres:postgres@localhost:5432/settlemint_v1).
# Without it, `npm run dev:v1` uses a built-in PGlite database and needs nothing.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: settlemint_v1
    ports:
      - "5432:5432"
    volumes:
      - settlemint_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  settlemint_pgdata:
